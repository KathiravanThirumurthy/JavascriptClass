<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="./css/ex2.css">
</head>

<body>

    <div class="container">

        <h1>TASK MANAGER</h1>

        <!-- Add Task Form -->
        <form id="taskForm">

            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter task..."
                >

                <button type="submit">
                    Add
                </button>

            </div>

            <p id="message"></p>

        </form>


        <!-- Task Section -->

        <h2>Tasks</h2>

        <div id="taskList">

            <!-- Tasks will be added here -->

        </div>

    </div>


    <script src="./JS/ex2.js"></script>

</body>

</html>
